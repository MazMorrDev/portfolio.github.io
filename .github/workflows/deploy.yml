name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]  # Cambia a 'master' si esa es tu rama principal
  workflow_dispatch:    # Permite ejecutar manualmente

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      # 1. Configura Node.js y pnpm en un solo paso
      - name: Setup Node.js and pnpm
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: 'pnpm'  # Esto habilita caché automáticamente
      
      # 2. Instala pnpm si no está incluido (forma explícita)
      - name: Install pnpm
        run: npm install -g pnpm
      
      # 3. Instala dependencias CON PNPM
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      
      # 4. Construye con Astro
      - name: Build with Astro
        run: pnpm run build
      
      # 5. Sube el artefacto
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist